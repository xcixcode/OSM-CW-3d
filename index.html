  for(let k=0;k<4;k++){const s=new THREE.Mesh(new THREE.IcosahedronGeometry(rr(180,300),0),cmat);s.position.set(k*260-400,rr(-40,80),rr(-120,120));g.add(s)}
  g.position.set(rr(-9000,9000),rr(1500,2200),rr(-9000,9000));scene.add(g);clouds.push(g)}
const sp=[];for(let i=0;i<500;i++){const a=rnd()*6.283,b=rnd()*1.3+.1;sp.push(Math.cos(a)*Math.cos(b)*35000,Math.sin(b)*35000,Math.sin(a)*Math.cos(b)*35000)}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:2.5,sizeAttenuation:false,fog:false}));
const moon=new THREE.Mesh(new THREE.SphereGeometry(900,10,8),new THREE.MeshBasicMaterial({color:0xfff6d6,fog:false}));
moon.position.set(-18000,20000,-30000);stars.visible=moon.visible=false;scene.add(stars,moon);
function setNight(n){night=n;const f=n?0x1a2a4a:0xd2ebf8;paintSky(n?0x050a1c:0x4f9ee0,f);scene.fog.color.set(f);
  hemi.intensity=n?.3:.75;sun.intensity=n?.2:1;sun.color.set(n?0x8fa8ff:0xfff2d6);
  wallM.emissiveIntensity=n?1:0;stars.visible=moon.visible=n;$('#tn').textContent=n?'☀️ 낮':'🌙 밤'}
$('#tn').onclick=()=>setNight(!night);

// 라벨 (OSM 명칭)
const L=D.L.map(l=>[l[0],l[1],l[3]?12:55,l[2],l[0]==='경상남도청'?1:0]);L.push(['창원광장',0,90,0,1]);
const lb=L.map(l=>{const d=document.createElement('div');d.textContent=l[0];$('#lbls').appendChild(d);return{d,f:l[4],v:new THREE.Vector3(l[1],l[2],l[3])}});
function lab(){const w=innerWidth,h=innerHeight;lb.forEach(o=>{const v=o.v.clone().project(cam),s=v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1&&(o.f||rad<4500);
  o.d.style.display=s?'block':'none';if(s)o.d.style.transform='translate(-50%,-50%) translate('+((v.x*.5+.5)*w)+'px,'+((-v.y*.5+.5)*h)+'px)'})}

// 컨트롤
const tgt=new THREE.Vector3(-1330,0,3155),goal=tgt.clone();
let rad=19000,rGoal=19000,th=.5,thG=.5,ph=1,phG=1,auto=false;
const V=D.V;
// 빠른 이동 메뉴 (이름 태그가 있는 건물·도로·장소)
const QM=$('#qm'),QL=$('#ql'),QS=$('#qs'),QT=document.querySelectorAll('#qm .qt button');
let qtab='a',qlist=[];const QALL=[...D.q.p,...D.q.r,...D.q.b];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function qrender(){const kw=QS.value.trim().toLowerCase();
  qlist=(qtab==='a'?QALL:D.q[qtab]).filter(it=>!kw||it[0].toLowerCase().includes(kw)||it[3].includes(kw));
  const sh=qlist.slice(0,3000);
  QL.innerHTML='<button class="qi" data-i="-1"><b>🗺 성산구 전체 보기</b></button>'+sh.map((it,i)=>'<button class="qi" data-i="'+i+'"><b>'+esc(it[0])+'</b><span>'+esc(it[3])+'</span></button>').join('')
    +(qlist.length>3000?'<div class="qn">'+qlist.length+'개 중 3000개 표시 · 검색으로 좁혀 보세요</div>':qlist.length?'':'<div class="qn">결과 없음</div>')}
function qopen(){QM.style.display='flex';qrender()}
function qclose(){QM.style.display='none';QS.blur()}
const bm=new THREE.Mesh(new THREE.CylinderGeometry(4,4,160,10),new THREE.MeshBasicMaterial({color:0xff6b35,transparent:true,opacity:.65,depthWrite:false}));
bm.visible=false;bm.frustumCulled=false;scene.add(bm);let bmT=0;
function beacon(x,z){bm.position.set(x,80,z);bm.visible=true;bmT=performance.now()+6000}
QL.onclick=e=>{const b=e.target.closest?e.target.closest('.qi'):null;if(!b)return;const i=+b.dataset.i;
  if(i<0){goal.set(-1330,0,3155);rGoal=19000;phG=1;auto=false;qclose();return}
  const it=qlist[i];if(!it)return;
  goal.set(it[1],0,it[2]);rGoal=it[4]||(qtab==='b'?260:qtab==='r'?700:520);phG=1.05;auto=false;beacon(it[1],it[2]);qclose()};
QT.forEach(b=>b.onclick=()=>{qtab=b.dataset.t;QT.forEach(x=>x.classList.toggle('on',x===b));QS.value='';qrender();QL.scrollTop=0});
$('#tq').onclick=()=>QM.style.display==='flex'?qclose():qopen();
$('#qc').onclick=qclose;QS.oninput=qrender;

$('#ta').onclick=()=>auto=!auto;
const cv=renderer.domElement,ptrs=new Map();
// 이동 조작: PC는 WASD(Shift 가속, Q/E 회전), 모바일은 가상 조이스틱(🕹 버튼으로 숨김/표시)
const keys=new Set();let jx=0,jy=0,jid=null;
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;if(/^(KeyW|KeyA|KeyS|KeyD|KeyQ|KeyE|ShiftLeft|ShiftRight)$/.test(e.code)){keys.add(e.code);auto=false}});
addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());
const joy=$('#joy'),knob=joy.firstElementChild;
const TP=new Map();let joyOn=false,idleSince=null,bx=0,by=0,jboost=false;
function setBoost(v){if(v===jboost)return;jboost=v;knob.style.background=v?'#ff9f1c':'';joy.style.borderColor=v?'#ff9f1c':''}
function joyShow(x,y){joy.style.left=(x-62)+'px';joy.style.top=(y-62)+'px';joy.style.opacity=1;knob.style.transform='translate(0,0)';bx=x;by=y;joyOn=true;idleSince=performance.now()}
function joyHide(){joy.style.opacity=0;knob.style.transform='translate(0,0)';jx=jy=0;joyOn=false;idleSince=null;setBoost(false)}
function joyMove(x,y){const MX=42;let dx=x-bx,dy=y-by;const m=Math.hypot(dx,dy);if(m>=MX*.97)setBoost(true);else if(m<MX*.85)setBoost(false);if(m>MX){dx*=MX/m;dy*=MX/m}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';jx=dx/MX;jy=dy/MX;auto=false;
  if(Math.hypot(jx,jy)<.1){if(idleSince===null)idleSince=performance.now()}else idleSince=null}
// 모바일: 왼쪽 절반 터치=그 자리에 조이스틱 생성(배경 고정, 입력 없으면 1초 뒤 사라짐), 오른쪽 절반 한 손가락 드래그=회전
// 이미 조이스틱/회전 손가락이 있으면 두 번째 손가락은 남은 역할(어느 쪽이든), 가까운 두 손가락을 거의 동시에 누르면 확대/축소
cv.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;auto=false;
  const now=performance.now(),P={x:e.clientX,y:e.clientY,role:'none',t0:now},act=[...TP.values()],left=P.x<innerWidth*.5;
  const near=act.find(q=>(q.role==='joy'||q.role==='look')&&now-q.t0<300&&Math.hypot(q.x-P.x,q.y-P.y)<Math.min(260,innerWidth*.55));
  if(near){if(near.role==='joy')joyHide();near.role='pinch';P.role='pinch'}
  else if(!act.some(q=>q.role==='pinch')){
    const hasJoy=act.some(q=>q.role==='joy'),hasLook=act.some(q=>q.role==='look');let want=left?'joy':'look';
    if(want==='joy'&&hasJoy)want=hasLook?'none':'look';else if(want==='look'&&hasLook)want=hasJoy?'none':'joy';
    P.role=want;if(want==='joy')joyShow(P.x,P.y)}
  TP.set(e.pointerId,P)});
cv.addEventListener('pointermove',e=>{if(e.pointerType!=='touch')return;const p=TP.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(p.role==='joy'){p.x=e.clientX;p.y=e.clientY;if(!joyOn){if(Math.hypot(dx,dy)<2)return;joyShow(p.x,p.y)}joyMove(p.x,p.y)}
  else if(p.role==='look'){p.x=e.clientX;p.y=e.clientY;thG-=dx*.006;phG=clamp(phG-dy*.005,.2,1.45)}
  else if(p.role==='pinch'){const o=[...TP.values()].filter(q=>q.role==='pinch');
    if(o.length===2){const d0=Math.hypot(o[0].x-o[1].x,o[0].y-o[1].y);p.x=e.clientX;p.y=e.clientY;const d1=Math.hypot(o[0].x-o[1].x,o[0].y-o[1].y);if(d1>0)rGoal=clamp(rGoal*d0/d1,80,26000)}else{p.x=e.clientX;p.y=e.clientY}}});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>{if(e.pointerType!=='touch')return;const p=TP.get(e.pointerId);if(!p)return;TP.delete(e.pointerId);
  if(p.role==='joy'){jx=jy=0;knob.style.transform='translate(0,0)';idleSince=performance.now();setBoost(false)}
  if(p.role==='pinch')TP.forEach(q=>{if(q.role==='pinch')q.role='none'})}));
function move(dt){if(joyOn&&idleSince!==null&&performance.now()-idleSince>1000)joyHide();if(bm.visible&&performance.now()>bmT)bm.visible=false;let ix=jx,iz=jy,rot=0;
  if(keys.has('KeyW'))iz-=1;if(keys.has('KeyS'))iz+=1;if(keys.has('KeyA'))ix-=1;if(keys.has('KeyD'))ix+=1;
  if(keys.has('KeyQ'))rot-=1;if(keys.has('KeyE'))rot+=1;
  if(rot)thG+=rot*dt*1.2;
  const m=Math.hypot(ix,iz);if(m<.05)return;
  const k=Math.min(1,m)/m,sp=clamp(rad*.35,40,6000)*((keys.has('ShiftLeft')||keys.has('ShiftRight')||jboost)?3:1)*dt,s=Math.sin(th),c=Math.cos(th);
  ix*=k;iz*=k;
  goal.x=clamp(goal.x+(ix*c+iz*s)*sp,-14000,14000);goal.z=clamp(goal.z+(-ix*s+iz*c)*sp,-14000,14000)}
const dist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});auto=false});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>ptrs.delete(e.pointerId)));
function pan(dx,dy){const k=rad*.0016,s=Math.sin(th),c=Math.cos(th);
  goal.x=clamp(goal.x-dx*c*k-dy*s*k,-14000,14000);goal.z=clamp(goal.z+dx*s*k-dy*c*k,-14000,14000)}
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===2){const a=[...ptrs.values()],mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2,d0=dist();
    p.x=e.clientX;p.y=e.clientY;const b=[...ptrs.values()],d1=dist();
    if(d1>0)rGoal=clamp(rGoal*d0/d1,80,26000);return}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(e.buttons&2||e.shiftKey)pan(dx,dy);else{thG-=dx*.006;phG=clamp(phG-dy*.005,.2,1.45)}});
cv.addEventListener('wheel',e=>{e.preventDefault();rGoal=clamp(rGoal*(1+e.deltaY*.001),80,26000)},{passive:false});
function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

let last=performance.now(),ld=$('#ld');
function loop(now){requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  move(dt);if(auto)thG+=dt*.15;
  th+=(thG-th)*.1;ph+=(phG-ph)*.1;rad+=(rGoal-rad)*.1;tgt.lerp(goal,.1);
  cam.position.set(tgt.x+rad*Math.sin(ph)*Math.sin(th),tgt.y+rad*Math.cos(ph),tgt.z+rad*Math.sin(ph)*Math.cos(th));
  cam.lookAt(tgt);
  const ext=clamp(rad*.8,250,2400),sc=sun.shadow.camera;sc.left=sc.bottom=-ext;sc.right=sc.top=ext;sc.updateProjectionMatrix();
  sun.target.position.copy(tgt);sun.position.copy(tgt).add(sunOff);
  traffic(dt);
  
  renderer.render(scene,cam);lab();if(ld){ld.remove();ld=null}
}
requestAnimationFrame(loop);
},30));
</script>
